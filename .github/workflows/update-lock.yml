name: update-lock

# manual button in the Actions tab + a monthly bump. Validation happens IN THIS
# JOB before pushing: pushes made with the default GITHUB_TOKEN deliberately
# never trigger other workflows, so `check` does not run on the bump commit.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *" # 1st of the month, 03:00 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22

      - run: nix flake update

      - name: evaluate updated lock
        run: nix build .#nixosConfigurations.sal-9000.config.system.build.toplevel --dry-run

      - name: flake check
        run: nix flake check

      - name: commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git diff --cached --quiet || git commit -m "flake.lock: update inputs"
          git push
