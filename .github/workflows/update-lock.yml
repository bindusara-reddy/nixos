name: update-lock

# manual button in the Actions tab: bumps flake.lock on the branch you run it
# from, and the `check` workflow then validates the result.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - run: nix flake update

      - name: commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git diff --cached --quiet || git commit -m "flake.lock: update inputs"
          git push
