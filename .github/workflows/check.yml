name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22

      # full evaluation of the system closure — catches typos, renamed options,
      # missing packages, failed assertions. Does not compile anything.
      - name: evaluate sal-9000
        run: nix build .#nixosConfigurations.sal-9000.config.system.build.toplevel --dry-run

      - name: flake check
        run: nix flake check

      # the same tools the devShell carries — formatting and lint stay honest
      - name: lint
        run: |
          nix run nixpkgs#alejandra -- --check .
          nix run nixpkgs#statix -- check .
          nix run nixpkgs#deadnix -- --fail --exclude hosts/sal-9000/hardware-configuration.nix -- .
