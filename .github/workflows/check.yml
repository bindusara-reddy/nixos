name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v22

      # full evaluation of the system closure — catches typos, renamed options,
      # missing packages, failed assertions. Does not compile anything.
      - name: evaluate hal-9000
        run: nix build .#nixosConfigurations.hal-9000.config.system.build.toplevel --dry-run

      - name: flake check
        run: nix flake check

      # the same tools the devShell carries — formatting and lint stay honest
      - name: lint
        run: |
          nix run nixpkgs#alejandra -- --check .
          nix run nixpkgs#statix -- check .
          nix run nixpkgs#deadnix -- --fail --exclude hosts/hal-9000/hardware-configuration.nix -- .

      - name: scan Git history for secrets
        # v8.30.1 has a reported default-rule regression; keep this known-good
        # binary checksum-pinned until upstream ships a fixed release.
        run: |
          curl -fsSLo /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.29.1/gitleaks_8.29.1_linux_x64.tar.gz
          echo "e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner
